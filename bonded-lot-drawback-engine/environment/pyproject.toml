[project]
name = "bonded"
version = "0.0.1"
description = "North River Bonded — Bondwright lot ledger"
requires-python = ">=3.12"

[project.scripts]
bonded = "bonded.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bonded*"]
